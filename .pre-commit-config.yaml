---
# Secrets tripwire: blocks commits that stage anything key-shaped.
# Same setup as the dotfiles repo. Scans only STAGED files at commit time.
fail_fast: false

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
